[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "jev-llm-router-benchmark"
version = "0.0.1"
description = "Honest, reproducible Jev pre-routing benchmark for two generative LLMs"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ErenAILab" }]
dependencies = []

[project.scripts]
jev-router = "jev_router.cli:main"

[project.optional-dependencies]
dev = ["pytest==8.4.2"]
data = ["pyarrow==25.0.1"]
evaluation = ["numpy>=2,<3", "pandas>=2,<3", "tqdm>=4,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src/jev_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
