name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.9"
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: uv sync --extra dev --locked
      - run: uv run pytest
      - run: uv run jev-router smoke --output results/ci-smoke
        env:
          TYPESAFE_API_KEY: ""
          OPENAI_API_KEY: ""
