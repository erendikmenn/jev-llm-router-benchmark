luna_source_url = "https://openrouter.ai/openai/gpt-5.6-luna"
sol_source_url = "https://openrouter.ai/openai/gpt-5.6-sol"
catalog_endpoint = "https://openrouter.ai/api/v1/models"
jev_endpoint_catalog = "https://openrouter.ai/api/v1/models/typesafe/jev-1.13/endpoints"
note = "Prices were read from the authenticated OpenRouter catalog immediately before the live run."

[codex_tiers.luna]
model = "gpt-5.6-luna"
reasoning_effort = "medium"
profile = "Narrow, mechanical, low-risk work with explicit requirements and a small local scope."

[codex_tiers.terra]
model = "gpt-5.6-terra"
reasoning_effort = "high"
profile = "Normal multi-file implementation, routine debugging, tests, and repository exploration."

[codex_tiers.sol]
model = "gpt-5.6-sol"
reasoning_effort = "high"
profile = "Complex debugging, architecture-sensitive refactors, unclear failures, or high reasoning demand."

[codex_tiers.astra]
