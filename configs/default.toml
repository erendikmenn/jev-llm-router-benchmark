[experiment]
name = "jev-pre-routing-v1"
seed = 20260919
quality_loss_limit_pp = 2.0
default_threshold = 0.58
concurrency = 1
cache = false
stream = true
max_output_tokens = 256
request_timeout_seconds = 90.0
max_retries = 1
max_live_tasks_without_usd_cap = 12
max_live_output_tokens_without_usd_cap = 256

[router]
jev_model = "typesafe/jev-1.13"
typesafe_model = "jev-1.13.0"
jev_context_tokens = 32000
jev_state_plus_longest_question_tokens = 32000
low_confidence_fallback = "strong"
unsupported_fallback = "reject"
isolated_code_strong_probability_threshold = 0.08

[judge]
requirements_min = 0.70
scope_min = 0.70
behavior_support_min = 0.65
regression_revise = 0.60
self_test_bias_revise = 0.75
deep_review_escalate = 0.60
policy_violation_block = 0.75
risk_confidence_min = 0.35
uncertainty_band = 0.10
max_uncertain_signals = 2
clear_revise_probability = 0.55
# Balanced trajectory escalation requires concrete failure evidence. Jev uncertainty
# remains visible in receipts but does not, by itself, buy another full coding pass.
balanced_clear_failure_probability = 0.20
balanced_regression_escalate = 0.90
max_diff_chars = 40000
max_file_chars = 20000
max_context_chars = 72000

[models.cheap]
provider = "openrouter"
model_id = "openai/gpt-5.6-luna"
context_tokens = 1050000
max_output_tokens = 128000
input_usd_per_million = 0.20
cached_input_usd_per_million = 0.02
output_usd_per_million = 1.20
supports_streaming = true
text_only_benchmark_eligible = true
profile = "Routine rewriting, classification, extraction, translation, summarization, and straightforward QA; dev results must validate this profile."

[models.strong]
provider = "openrouter"
model_id = "openai/gpt-5.6-sol"
context_tokens = 1050000
max_output_tokens = 128000
input_usd_per_million = 2.00
cached_input_usd_per_million = 0.20
output_usd_per_million = 10.00
supports_streaming = true
text_only_benchmark_eligible = true
profile = "Complex constraints, multi-step reasoning, and difficult coding; dev results must validate this profile."

[pricing.jev]
input_usd_per_million = 0.042
output_usd_per_million = 0.0
source_checked_at = "2026-09-19"
source_url = "https://openrouter.ai/typesafe/jev-1.13"

[pricing.openrouter]
